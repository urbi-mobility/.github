name: Label issue by priority

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  label-priority:
    runs-on: ubuntu-latest

    steps:
      - name: Apply priority label
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";

            const priorityToLabel = {
              "High": "High Priority",
              "Medium": "Medium Priority",
              "Low": "Low Priority"
            };

            const prioritySectionMatch = body.match(
              /###\s*Priority\s*\r?\n+([\s\S]*?)(?=\r?\n###|\s*$)/i
            );

            if (!prioritySectionMatch) {
              console.log("Priority section not found.");
              return;
            }

            const selectedPriority = prioritySectionMatch[1]
              .trim()
              .split(/\r?\n/)[0]
              .trim();

            const selectedLabel = priorityToLabel[selectedPriority];

            if (!selectedLabel) {
              console.log(`Invalid priority value: ${selectedPriority}`);
              return;
            }

            console.log(`Selected priority: ${selectedPriority}`);
            console.log(`Label to apply: ${selectedLabel}`);

            const priorityLabels = Object.values(priorityToLabel);
            const currentLabels = issue.labels.map(label => label.name);

            for (const label of priorityLabels) {
              if (label !== selectedLabel && currentLabels.includes(label)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: label
                });
              }
            }

            if (!currentLabels.includes(selectedLabel)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [selectedLabel]
              });
            }
